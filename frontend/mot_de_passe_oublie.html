<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récupération de Mot de Passe - DermaFlow AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
:root {
    --primary: #0891b2;
    --primary-dark: #0e7490;
    --primary-light: #cffafe;
    --bg-gradient: linear-gradient(135deg, #ecfeff 0%, #ffffff 50%, #e0f2fe 100%);
    --text-main: #334155;
    --text-muted: #64748b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-main);
    overflow-x: hidden;
    position: relative;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.forgot-container {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    box-shadow: 0 30px 60px rgba(8, 145, 178, 0.08), 0 0 0 1px rgba(255,255,255,0.5);
    width: 100%;
    max-width: 500px;
    padding: 50px 40px;
    text-align: center;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.forgot-header {
    margin-bottom: 30px;
}
.forgot-header i {
    width: 80px;
    height: 80px;
    background: var(--primary-light);
    color: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    margin: 0 auto 20px auto;
    box-shadow: 0 10px 20px rgba(8, 145, 178, 0.15);
}
.forgot-header h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--primary-dark);
    margin-bottom: 10px;
    letter-spacing: -0.5px;
}
.forgot-header p {
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.6;
}

.form-group {
    text-align: left;
    margin-bottom: 25px;
    position: relative;
}
.form-group label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 8px;
    color: var(--text-main);
}
.form-group input {
    width: 100%;
    padding: 16px;
    background: #f8fafc;
    border: 2px solid transparent;
    border-radius: 12px;
    font-size: 1rem;
    font-family: inherit;
    transition: all 0.3s ease;
    outline: none;
    color: var(--text-main);
}
.form-group input:focus {
    background: white;
    border-color: var(--primary);
    box-shadow: 0 8px 20px rgba(8, 145, 178, 0.08);
    transform: translateY(-2px);
}

.forgot-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(8, 145, 178, 0.3);
}
.forgot-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(8, 145, 178, 0.4);
}

.back-home {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 25px;
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.3s ease;
}
.back-home:hover { color: var(--primary); transform: translateX(-5px); }

.hidden { display: none !important; }

@media (max-width: 600px) {
    .forgot-container { margin: 20px; padding: 40px 25px; }
}
</style>
</head>
<body>
    <div class="forgot-container">
        <div id="step1">
            <div class="forgot-header">
                <i class="fas fa-key"></i>
                <h1>Mot de passe oublié ?</h1>
                <p>Entrez votre adresse email pour réinitialiser votre mot de passe.</p>
            </div>
            <div class="form-group">
                <label>Adresse Email</label>
                <input type="email" id="forgotEmail" placeholder="exemple@mail.com">
            </div>
            <button class="forgot-btn" onclick="requestReset()">Envoyer le lien de récupération</button>
            <a href="connexion.html" class="back-home"><i class="fas fa-arrow-left"></i> Retour à la connexion</a>
        </div>

        <div id="step2" class="hidden">
            <div class="forgot-header">
                <i class="fas fa-lock-open"></i>
                <h1>Nouveau mot de passe</h1>
                <p>Veuillez choisir un nouveau mot de passe sécurisé.</p>
            </div>
            <div class="form-group">
                <label>Nouveau Mot de Passe</label>
                <input type="password" id="newPassword" placeholder="Entrez votre nouveau mot de passe">
            </div>
            <div class="form-group">
                <label>Confirmer le Mot de Passe</label>
                <input type="password" id="confirmPassword" placeholder="Confirmez le nouveau mot de passe">
            </div>
            <button class="forgot-btn" onclick="resetPassword()">Réinitialiser le mot de passe</button>
            <a href="connexion.html" class="back-home"><i class="fas fa-arrow-left"></i> Retour à la connexion</a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let resetToken = '';

        async function requestReset() {
            const email = document.getElementById('forgotEmail').value.trim();
            if (!email) {
                alert('Veuillez entrer votre email.');
                return;
            }

            try {
                const response = await fetch(API_BASE + '/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email }),
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Erreur lors de la demande');
                }

                // In a real app, the token would be sent by email.
                // For this prototype, we receive it in the response.
                resetToken = data.token;
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } catch (error) {
                alert(error.message);
            }
        }

        async function resetPassword() {
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!password || !confirmPassword) {
                alert('Veuillez remplir tous les champs.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Les mots de passe ne correspondent pas.');
                return;
            }

            try {
                const response = await fetch(API_BASE + '/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        token: resetToken,
                        new_password: password 
                    }),
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || 'Erreur lors de la réinitialisation');
                }

                alert('Mot de passe réinitialisé avec succès ! Vous pouvez maintenant vous connecter.');
                window.location.href = 'connexion.html';
            } catch (error) {
                alert(error.message);
            }
        }
    </script>
</body>
</html>
